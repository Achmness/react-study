<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      

      function ProductDetails ({products, price, discountPrice, image}) {
        return (
          <div>
            {image === 'cotton-socks' && (
              <img src='cotton-socks.png' width='50' /> 
            )}  
            {image === 'tennis-balls' && (
              <img src='tennis-balls.png' width='50' /> 
            )}  
            {image === 'plain-t-shirt' && (
              <img src='plain-t-shirt.png' width='50' /> 
            )}  
            <div>
              {products}
            </div>  
            {!!discountPrice ? (
              <>
                <del><p>Price: {price}</p></del>
                <p>Discount Price: {discountPrice}</p>
              </>
            ) : (
              <p>Price: {price}</p>
            )}
            <button>Add to Cart</button>
          </div>
        );
      }
      

      function App () {
        return (
          <>
            <ProductDetails 
              products='Cotton Socks' 
              price='$10.90' 
              discountPrice='$5.45' 
              image='cotton-socks' 
            />
            <ProductDetails 
              products='Tennis Balls' 
              price='$6.00' 
              image='tennis-balls' 
            />
            <ProductDetails
              products='Plain T-Shirt' 
              price='$7.99' 
              image='plain-t-shirt' 
            />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
